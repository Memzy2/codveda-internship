<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
    <title>Interactive Form</title>
</head>
<body>
    <header>
        <h1>
            Interactive Form
        </h1>
    </header>
    <form class="form">
        <label for="text">
            Name:
        </label>
        <input type="text" name="name" placeholder="enter full name">
        <br>
        <br>

        <label for="email">
            Email:
        </label>
        <input type="email" name="email" placeholder="email address">
        <br>
        <br>

        <label for="tel">
            Phone Number:
        </label>
        <input type="tel" name="telephone number">
        <br>
        <br>

        <label for="password">
            Password:
        </label>
        <input type="password" name="password">
        <br>
        <br>

        <input type="submit" value="Submit">
    </form>
    <footer>
        <div class="footer-content">
            <p class="quote">"Ideas are funny little things. They don't work unless you do."</p>
            <p class="coded-by">Coded by Memory Chungulo</p>
            <div class="social-links">
                <a href="https://github.com/Memzy2" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/in/memory-chungulo" target="_blank">LinkedIn</a>
            </div>
        </div>
    </footer>
</body>
</html>
