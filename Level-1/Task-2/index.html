<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Interactive Form</h1>
    </header>

    <main class="form-container">
        <div id="success-panel" class="success-message hidden">
            🎉 Form Submitted Successfully!
        </div>

        <form class="form" id="interactiveForm" novalidate>
            <div class="input-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter full name">
                <span class="error" id="name-error"></span>
            </div>

            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email address">
                <span class="error" id="email-error"></span>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g., +123456789">
                <span class="error" id="phone-error"></span>
            </div>

            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Min. 8 characters">
                <span class="error" id="password-error"></span>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </main>

    <footer>
        <div class="footer-content">
            <p class="quote">"Ideas are funny little things. They don't work unless you do."</p>
            <p class="coded-by">Coded by Memory Chungulo</p>
            <div class="social-links">
                <a href="https://github.com/Memzy2" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/in/memory-chungulo" target="_blank">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
